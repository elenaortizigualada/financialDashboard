<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
  </head>
  <body>
    <main>
      <h1>Autorizar franela Finanzas</h1>
      <p id="status">Comprobando acceso a las hojas anuales…</p>
      <p>Esta Web App busca pestañas con el formato GASTOS YYYY. Solo lectura.</p>
    </main>
    <script>
      const status = document.getElementById('status');

      google.script.run
        .withSuccessHandler(years => {
          const available = years.length ? years.map(year => `GASTOS ${year}`).join(', ') : 'ninguna pestaña GASTOS YYYY';
          status.textContent = `Acceso autorizado. Pestañas disponibles: ${available}. Vuelve a franela Finanzas para cargar la hoja.`;
        })
        .withFailureHandler(error => {
          const message = error && error.message ? error.message : 'No se pudo leer la spreadsheet.';
          status.textContent = message;
        })
        .getAvailableYears();
    </script>
  </body>
</html>
